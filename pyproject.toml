[project]
name = "JoSE"
version = "1.0.0"
description = "Joint-Space Empowerment for Action Manifold Discovery in Muscle and Tendon-Driven Hands"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = {text = "MIT"}
authors = [
    {name = "James Heald", email = "jamesbheald@gmail.com"},
]

dependencies = [
    "jax[cuda]==0.4.30",
    "distrax==0.1.5",
    "flax==0.8.5",
    "orbax-checkpoint==0.5.7",
    "optax==0.2.2",
    "sbx-rl==0.20.0",
    "mujoco==3.3.0",
    "MyoSuite==2.11.5",
    "pyquaternion==0.9.9",
    "wandb==0.19.11",
    "tensorboard==2.18.0",
    "hydra-core==1.3.2",
    "moviepy==1.0.3",
    "lattice @ git+https://github.com/jamesheald/lattice.git@275034e",
    "importlib-resources==6.4.5",
    "stable_baselines3==2.5.0",
    "gymnasium_robotics",
    "scikit-learn",
    "huggingface_hub",
    "pytest>=7.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::UserWarning:gymnasium.envs.registration",
    "ignore::UserWarning:gymnasium.utils.passive_env_checker",
    "ignore::glfw.GLFWError",
]
